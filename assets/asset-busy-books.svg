<svg width="760" height="600" viewBox="0 0 760 600" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="pageShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="380" cy="540" rx="240" ry="34" fill="#0a1a33" opacity="0.28" filter="url(#pageShadow)"/>

  <!-- BACK PAGE (green) -->
  <g transform="translate(150,120) rotate(-9)">
    <rect x="6" y="10" width="290" height="370" rx="16" fill="#06202a" opacity="0.35" filter="url(#pageShadow)"/>
    <rect width="290" height="370" rx="16" fill="#ffffff"/>
    <rect width="290" height="52" rx="16" fill="#3fb27a"/>
    <rect y="30" width="290" height="22" fill="#3fb27a"/>
    <text x="24" y="34" font-size="15" font-weight="800" fill="#ffffff">Shapes &amp; Colors</text>
    <!-- shapes -->
    <circle cx="70" cy="130" r="30" fill="#f6c85a"/>
    <rect x="130" y="100" width="60" height="60" rx="8" fill="#8fd0e8"/>
    <path d="M240 160 l-30 -60 l-30 60 z" fill="#f2a0b8"/>
    <!-- match lines -->
    <circle cx="50" cy="240" r="12" fill="#f6c85a"/><circle cx="240" cy="240" r="12" fill="#8fd0e8"/>
    <path d="M62 240 q90 -20 166 0" stroke="#dfe5ee" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
    <circle cx="50" cy="300" r="12" fill="#f2a0b8"/><circle cx="240" cy="300" r="12" fill="#a7e0c3"/>
    <path d="M62 300 q90 20 166 0" stroke="#dfe5ee" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- MIDDLE PAGE (blue) -->
  <g transform="translate(250,105) rotate(3)">
    <rect x="6" y="10" width="290" height="380" rx="16" fill="#06202a" opacity="0.30" filter="url(#pageShadow)"/>
    <rect width="290" height="380" rx="16" fill="#ffffff"/>
    <rect width="290" height="52" rx="16" fill="#3a7bd0"/>
    <rect y="30" width="290" height="22" fill="#3a7bd0"/>
    <text x="24" y="34" font-size="15" font-weight="800" fill="#ffffff">Count &amp; Trace</text>
    <!-- counting dots -->
    <g fill="#bcd6f5">
      <circle cx="52" cy="120" r="12"/><circle cx="90" cy="120" r="12"/><circle cx="128" cy="120" r="12"/>
    </g>
    <text x="200" y="128" font-size="30" font-weight="800" fill="#3a7bd0">3</text>
    <g fill="#f6c85a">
      <circle cx="52" cy="176" r="12"/><circle cx="90" cy="176" r="12"/>
    </g>
    <text x="200" y="184" font-size="30" font-weight="800" fill="#3a7bd0">2</text>
    <!-- trace numbers -->
    <text x="40" y="290" font-size="70" font-weight="800" fill="none" stroke="#dfe5ee" stroke-width="3" stroke-dasharray="6 7">1 2 3</text>
  </g>

  <!-- FRONT PAGE (orange) -->
  <g transform="translate(350,135) rotate(12)">
    <rect x="6" y="10" width="290" height="375" rx="16" fill="#06202a" opacity="0.32" filter="url(#pageShadow)"/>
    <rect width="290" height="375" rx="16" fill="#ffffff"/>
    <rect width="290" height="52" rx="16" fill="#ec6b2d"/>
    <rect y="30" width="290" height="22" fill="#ec6b2d"/>
    <text x="24" y="34" font-size="15" font-weight="800" fill="#ffffff">ABC Tracing</text>
    <!-- big traceable letters -->
    <text x="30" y="170" font-size="86" font-weight="800" fill="none" stroke="#f3c3a6" stroke-width="4" stroke-dasharray="7 8">A a</text>
    <text x="30" y="270" font-size="86" font-weight="800" fill="none" stroke="#f3c3a6" stroke-width="4" stroke-dasharray="7 8">B b</text>
    <!-- guide lines -->
    <line x1="24" y1="300" x2="266" y2="300" stroke="#eef2f7" stroke-width="2"/>
    <line x1="24" y1="330" x2="266" y2="330" stroke="#eef2f7" stroke-width="2" stroke-dasharray="4 5"/>
    <!-- star sticker -->
    <g transform="translate(228,120)" fill="#f5b83d">
      <path d="M14 0 l3.6 7.4 8.1 1.1 -5.9 5.7 1.4 8.1 -7.2 -3.8 -7.2 3.8 1.4 -8.1 -5.9 -5.7 8.1 -1.1z"/>
    </g>
  </g>
</svg>
