<svg width="800" height="560" viewBox="0 0 800 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lidscr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5fa"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7ecf3"/>
      <stop offset="1" stop-color="#cdd6e2"/>
    </linearGradient>
    <linearGradient id="pub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5813f"/>
      <stop offset="1" stop-color="#e35b1f"/>
    </linearGradient>
    <filter id="lapShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="400" cy="500" rx="270" ry="30" fill="#0a1a33" opacity="0.30" filter="url(#lapShadow)"/>

  <!-- laptop base -->
  <path d="M150 452 h500 a10 10 0 0 1 10 10 v6 a14 14 0 0 1 -14 14 H154 a14 14 0 0 1 -14 -14 v-6 a10 10 0 0 1 10 -10z" fill="url(#base)"/>
  <rect x="150" y="452" width="500" height="8" fill="#dbe2ec"/>
  <rect x="360" y="452" width="80" height="8" rx="4" fill="#c2cdda"/>

  <!-- screen -->
  <rect x="176" y="70" width="448" height="384" rx="18" fill="#20304d"/>
  <rect x="186" y="80" width="428" height="364" rx="10" fill="url(#lidscr)"/>

  <!-- top bar -->
  <rect x="186" y="80" width="428" height="42" rx="10" fill="#f4f6f9"/>
  <rect x="186" y="112" width="428" height="10" fill="#f4f6f9"/>
  <circle cx="208" cy="101" r="5" fill="#ff6058"/>
  <circle cx="226" cy="101" r="5" fill="#ffbd2e"/>
  <circle cx="244" cy="101" r="5" fill="#28c840"/>
  <text x="330" y="105" font-size="12" font-weight="700" fill="#8b98ab">Product builder</text>
  <rect x="516" y="90" width="84" height="24" rx="12" fill="url(#pub)"/>
  <text x="558" y="106" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Publish</text>
  <line x1="186" y1="122" x2="614" y2="122" stroke="#e6ebf1" stroke-width="1"/>

  <!-- sidebar -->
  <rect x="186" y="122" width="118" height="322" fill="#f7f9fc"/>
  <rect x="204" y="146" width="82" height="10" rx="5" fill="#dbe3ee"/>
  <rect x="204" y="172" width="66" height="9" rx="4.5" fill="#e6ebf1"/>
  <rect x="204" y="194" width="74" height="9" rx="4.5" fill="#e6ebf1"/>
  <rect x="196" y="214" width="98" height="30" rx="8" fill="#fff" stroke="#ec6b2d" stroke-width="1.5"/>
  <circle cx="214" cy="229" r="5" fill="#ec6b2d"/>
  <rect x="228" y="225" width="52" height="8" rx="4" fill="#c9d3e0"/>
  <rect x="204" y="262" width="70" height="9" rx="4.5" fill="#e6ebf1"/>
  <rect x="204" y="284" width="60" height="9" rx="4.5" fill="#e6ebf1"/>

  <!-- canvas: product being built -->
  <rect x="322" y="142" width="274" height="150" rx="12" fill="#eef3f9"/>
  <!-- image block -->
  <rect x="338" y="158" width="100" height="118" rx="8" fill="#dbe6f3"/>
  <circle cx="366" cy="196" r="12" fill="#b7cbe6"/>
  <path d="M344 246 l24 -26 l18 18 l14 -12 l24 24 z" fill="#c7d6ea"/>
  <!-- text blocks -->
  <rect x="452" y="162" width="128" height="12" rx="6" fill="#cdd8e6"/>
  <rect x="452" y="184" width="110" height="9" rx="4.5" fill="#dde5ef"/>
  <rect x="452" y="200" width="120" height="9" rx="4.5" fill="#dde5ef"/>
  <rect x="452" y="216" width="86" height="9" rx="4.5" fill="#dde5ef"/>
  <rect x="452" y="246" width="92" height="26" rx="13" fill="#ec6b2d"/>
  <rect x="470" y="256" width="56" height="7" rx="3.5" fill="#fbd3bb"/>

  <!-- stepper: Idea -> Product -> Sale -->
  <g transform="translate(322,318)">
    <circle cx="14" cy="10" r="12" fill="#2fae72"/>
    <path d="M8 10 l4 4 l8 -9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="15" font-size="13" font-weight="700" fill="#16294b">Idea</text>
    <line x1="78" y1="10" x2="118" y2="10" stroke="#cdd8e6" stroke-width="3" stroke-linecap="round"/>

    <circle cx="132" cy="10" r="12" fill="#ec6b2d"/>
    <circle cx="132" cy="10" r="4" fill="#fff"/>
    <text x="152" y="15" font-size="13" font-weight="700" fill="#16294b">Product</text>
    <line x1="214" y1="10" x2="254" y2="10" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/>

    <circle cx="268" cy="10" r="12" fill="#e7edf4"/>
    <text x="288" y="15" font-size="13" font-weight="700" fill="#9aa7b8">Sale</text>
  </g>

  <!-- progress -->
  <rect x="322" y="360" width="274" height="8" rx="4" fill="#e6ebf1"/>
  <rect x="322" y="360" width="150" height="8" rx="4" fill="#ec6b2d"/>
  <text x="322" y="392" font-size="12" font-weight="600" fill="#8b98ab">Building your product · 60%</text>
</svg>
