<svg width="560" height="640" viewBox="0 0 560 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5813f"/>
      <stop offset="1" stop-color="#e35b1f"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43c988"/>
      <stop offset="1" stop-color="#2fae72"/>
    </linearGradient>
    <filter id="blurShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- floating shadow -->
  <ellipse cx="280" cy="600" rx="150" ry="26" fill="#0a1a33" opacity="0.30" filter="url(#blurShadow)"/>

  <!-- accent sparkles/coins -->
  <g opacity="0.95">
    <circle cx="120" cy="150" r="20" fill="#f5b83d"/>
    <text x="120" y="157" font-size="18" font-weight="800" fill="#b9791a" text-anchor="middle">₱</text>
    <circle cx="452" cy="120" r="14" fill="#f7c85a"/>
    <text x="452" y="126" font-size="13" font-weight="800" fill="#b9791a" text-anchor="middle">₱</text>
    <path d="M430 250 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z" fill="#ffd27a"/>
    <path d="M110 430 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#ffd27a"/>
  </g>

  <!-- phone -->
  <g>
    <rect x="140" y="60" width="280" height="530" rx="40" fill="#ffffff"/>
    <rect x="140" y="60" width="280" height="530" rx="40" fill="none" stroke="#e3e8ef" stroke-width="2"/>
    <rect x="152" y="74" width="256" height="502" rx="30" fill="url(#scr)"/>

    <!-- status bar -->
    <text x="176" y="108" font-size="13" font-weight="700" fill="#48566b">9:41</text>
    <rect x="360" y="98" width="26" height="12" rx="3" fill="#c9d3e0"/>
    <circle cx="342" cy="104" r="3" fill="#c9d3e0"/>
    <circle cx="332" cy="104" r="3" fill="#c9d3e0"/>

    <!-- success -->
    <circle cx="280" cy="192" r="42" fill="url(#ok)"/>
    <path d="M262 192 l12 12 l22 -24" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="280" y="262" font-size="19" font-weight="800" fill="#16294b" text-anchor="middle">Payment received</text>
    <text x="280" y="308" font-size="40" font-weight="800" fill="#e35b1f" text-anchor="middle">+₱500</text>
    <text x="280" y="336" font-size="14" font-weight="600" fill="#8b98ab" text-anchor="middle">Your first online sale</text>

    <!-- balance card -->
    <rect x="176" y="366" width="208" height="78" rx="16" fill="#f0f5fb"/>
    <text x="196" y="398" font-size="12" font-weight="600" fill="#8b98ab">Available balance</text>
    <text x="196" y="424" font-size="22" font-weight="800" fill="#16294b">₱500.00</text>
    <circle cx="356" cy="405" r="16" fill="#e3edf9"/>
    <path d="M350 405 h12 M356 399 v12" stroke="#2f6fd0" stroke-width="2.4" stroke-linecap="round"/>

    <!-- button -->
    <rect x="176" y="464" width="208" height="52" rx="26" fill="url(#btn)"/>
    <text x="280" y="497" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Withdraw</text>

    <!-- home indicator -->
    <rect x="248" y="556" width="64" height="5" rx="2.5" fill="#d4dbe5"/>
  </g>
</svg>
